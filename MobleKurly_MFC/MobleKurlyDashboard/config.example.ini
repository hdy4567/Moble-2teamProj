; On first build this template is copied to the EXE folder as config.ini if missing.
; Edit the config.ini beside the EXE. Rebuilds do not overwrite it.
; Do not upload config.ini to Git or share your MySQL password.
[mysql]
driver=MySQL ODBC 26.7 Unicode Driver
host=192.168.0.90
port=3306
database=moblekurly
user=moblekurly
password=

[pi]
enabled=1
host=192.168.0.217
port=5055

[camera]
; v21 integrated annotated inspection stream: http://<Pi IP>:8080/video_feed
enabled=1
host=192.168.0.217
port=8080
path=/video_feed

[cctv]
; Full-view CCTV feed; inspection [camera] is unchanged.
enabled=1
host=192.168.0.217
port=8081
path=/video_feed
