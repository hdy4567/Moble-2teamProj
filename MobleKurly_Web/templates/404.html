{% extends "base.html" %}
{% block title %}페이지를 찾을 수 없어요 | 모블 컬리{% endblock %}
{% block content %}
<section class="page-shell">
  <div class="panel empty-state">
    <span class="eyebrow">PAGE NOT FOUND</span>
    <h1>찾으시는 페이지가 없어요</h1>
    <p>주소가 변경되었거나, 더 이상 이용할 수 없는 페이지예요.<br>모블 컬리 홈에서 다시 만나세요.</p>
    <div class="page-actions">
      <a class="button secondary" href="{{ url_for('lookup') }}">주문 조회하기</a>
      <a class="button primary" href="{{ url_for('index') }}">홈으로 가기</a>
    </div>
  </div>
</section>
{% endblock %}
